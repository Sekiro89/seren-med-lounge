name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Same non-secret local-dev values as .env.example / docker-compose.yml —
  # nothing here is a real credential, so these live in the workflow file
  # rather than GitHub Secrets.
  JWT_SECRET: ci-only-not-a-real-secret
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 7d
  CORS_ORIGINS: http://localhost:3000,http://localhost:3001
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  checks:
    name: Lint, typecheck, build, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        # apps/api's build/typecheck import @prisma/client's generated
        # types, which don't exist until this has run once.
        run: pnpm --filter api run prisma:generate

      - name: Build
        # Must run before typecheck/lint-across-workspace: apps import
        # @serenemed/* packages by name (workspace symlink), resolved via
        # each package's compiled dist/ (its package.json "types"/"main"),
        # which doesn't exist on a fresh checkout until this runs. `pnpm
        # -r build` is topologically ordered, so packages build before
        # the apps that consume them.
        run: pnpm run build

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

  db-tests:
    name: RLS coverage, tenant isolation, e2e (live Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: serenemed
          POSTGRES_PASSWORD: serenemed
          POSTGRES_DB: serenemed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serenemed -d serenemed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # RedisService (apps/api/src/redis/redis.service.ts) connects to
        # REDIS_URL at startup — a fake/unreachable URL isn't enough,
        # the app actually needs a live Redis, same as docker-compose.yml
        # gives it locally.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # DATABASE_URL: the non-superuser serenemed_app role created by the
      # init-role step below. DIRECT_DATABASE_URL: the superuser role,
      # used only by `prisma migrate` — see
      # docs/architecture/security.md#row-level-security for why the app
      # must never run as the superuser (it would bypass RLS entirely).
      DATABASE_URL: postgresql://serenemed_app:serenemed_app@localhost:5432/serenemed?schema=public&connection_limit=10&pool_timeout=10
      DIRECT_DATABASE_URL: postgresql://serenemed:serenemed@localhost:5432/serenemed?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter api run prisma:generate

      - name: Build workspace packages
        # apps/api's own code (and its e2e specs) import @serenemed/*
        # packages by name, resolved via each package's compiled dist/ —
        # same reason as the `checks` job's Build step. Only the packages
        # are needed here, not the two frontends, so this filters to
        # those rather than running the full `pnpm run build`.
        run: pnpm --filter "./packages/*" build

      - name: Create the non-superuser app role
        # docker-compose gets this for free via postgres-init/'s
        # docker-entrypoint-initdb.d mount; a bare GitHub Actions service
        # container has no such hook, so run the exact same script by
        # hand once Postgres is up. Same source file, no duplicated SQL.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
          PGPASSWORD=serenemed psql -h localhost -U serenemed -d serenemed \
            -f infrastructure/docker/postgres-init/01-app-role.sql

      - name: Run migrations (creates tables + RLS policies)
        run: pnpm --filter api exec prisma migrate deploy

      - name: Verify RLS coverage + soft-delete convention
        run: pnpm --filter api run verify:tenant-isolation

      - name: e2e tests
        run: pnpm --filter api run test:e2e
