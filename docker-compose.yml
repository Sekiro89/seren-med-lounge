name: serenemed

services:
  postgres:
    image: postgres:16-alpine
    container_name: serenemed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serenemed
      POSTGRES_PASSWORD: serenemed
      POSTGRES_DB: serenemed
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - serenemed-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serenemed -d serenemed']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: serenemed-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - serenemed-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  serenemed-postgres-data:
  serenemed-redis-data:
